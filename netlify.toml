# Netlify build settings. Netlify reads this file automatically when the
# repo is connected, so no dashboard configuration is needed.
[build]
    command = "npm run build"
    publish = "dist"

[build.environment]
    NODE_VERSION = "22"

# ---------------------------------------------------------------------
# CONCEPT MODE — REMOVE THIS BLOCK AT HANDOFF (see HANDOFF.md).
# Tells search engines not to index any file on the preview, including
# images and PDFs that can't carry a <meta name="robots"> tag.
# ---------------------------------------------------------------------
[[headers]]
    for = "/*"
    [headers.values]
        X-Robots-Tag = "noindex, nofollow"

# Security and caching headers for every page.
[[headers]]
    for = "/*"
    [headers.values]
        Referrer-Policy = "strict-origin-when-cross-origin"
        X-Content-Type-Options = "nosniff"
        Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Hashed build assets never change, so browsers can cache them forever.
[[headers]]
    for = "/_astro/*"
    [headers.values]
        Cache-Control = "public, max-age=31536000, immutable"

# Old Squarespace URLs, so existing links and Google results still work
# after the switch. 301 = permanent move.
[[redirects]]
    from = "/home"
    to = "/"
    status = 301

[[redirects]]
    from = "/contact"
    to = "/location/"
    status = 301

[[redirects]]
    from = "/appointments"
    to = "/barbers/"
    status = 301

[[redirects]]
    from = "/cart"
    to = "/"
    status = 301
